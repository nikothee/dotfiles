## Hide RAOP/AirPlay sinks from Wine/Proton clients.
##
## Wine probes every sink at startup, which wakes the RAOP sinks and steals the
## AirPlay input on the Sonos speakers. See the script for the details.
##
## To disable: delete this file and `systemctl --user restart wireplumber`.

wireplumber.components = [
  {
    name = hide-network-sinks-from-wine.lua, type = script/lua
    provides = custom.hide-network-sinks-from-wine
    requires = [ support.lua-scripting ]
    ## access-default.lua grants { ["any"] = "all" } when a client shows up,
    ## so this has to run after it.
    wants = [ script.client.access-default ]
  }
]

wireplumber.profiles = {
  main = {
    custom.hide-network-sinks-from-wine = required
  }
}
