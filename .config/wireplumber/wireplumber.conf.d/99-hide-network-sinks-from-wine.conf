## Hide RAOP/AirPlay sinks from Wine/Proton clients.
##
## Wine's PulseAudio driver probes *every* sink at process startup:
## pulse_test_connect() -> pulse_probe_settings() -> pa_stream_connect_playback()
## against each named sink, to learn its native rate/format/period. For a RAOP
## sink that opens the RTSP session to the speaker, which makes the speaker
## switch to this machine's AirPlay input and drop whatever it was playing.
## module-raop-sink only tears the session down on an explicit Suspend, so it
## then sits there holding the speaker with silence.
##
## Wine clients get a permission manager that grants everything except the RAOP
## sinks, so those are never listed to them and there is nothing to probe. The
## manager applies default + per-node permissions in a single update and tracks
## sinks discovered later on its own.
##
## This is only race-free for clients that wait for the session manager to set
## their permissions. "unrestricted" clients get full access from PipeWire the
## moment they connect, and Wine probes right then, so pulse clients are put on
## "default" access in ~/.config/pipewire/pipewire-pulse.conf.d/50-client-access.conf.
##
## To disable: delete this file and `systemctl --user restart wireplumber`.

access.permission-managers = [
  {
    name = "hide-network-sinks"
    ## "all" parses to rwxm here, without the link bit
    default_permissions = "rwxml"
    rules = [
      {
        matches = [
          {
            media.class = "Audio/Sink"
            node.name = "~raop_sink.*"
          }
        ]
        actions = { set-permissions = "-" }
      }
    ]
  }
]

access.rules = [
  {
    matches = [ { application.process.binary = "~^wine.*" } ]
    actions = { update-props = { permission_manager_name = "hide-network-sinks" } }
  }
]
